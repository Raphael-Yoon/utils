<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roll Distribution</title>
    <link rel="stylesheet" href="dice_chart.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Dice Roll Distribution</h1>

    <div class="controls">
        <button id="startStopBtn">Start Simulation</button>
        <button id="resetBtn">Reset</button>
    </div>

    <p>Total Rolls: <span id="totalRolls">0</span></p>

    <div class="chart-container">
        <canvas id="diceChart"></canvas>
    </div>

    <script src="dice_chart.js"></script>
</body>
</html>
