<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe - Machine Learning</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Tic Tac Toe - AI vs AI</h1>

    <div id="controls">
        <button id="startTrainingBtn">Start Training</button>
        <button id="stopTrainingBtn" disabled>Stop Training</button>
        <button id="playVsAiBtn">Play against Trained AI</button>
        <button id="resetTrainingBtn">Reset Training Data</button>
        <button id="downloadQTableBtn">Download Q-Table</button>
    </div>

    <div id="stats">
        <p>Games Played: <span id="gamesPlayed">0</span></p>
        <p>AlphaGo Win Rate: <span id="aiWinRate">0.0%</span></p>
        <p>Lee Se-dol Win Rate: <span id="baselineWinRate">0.0%</span></p>
        <p>Draw Rate: <span id="drawRate">0.0%</span></p>
    </div>
    
    <h2 id="status">Ready to train or play.</h2>

    <div id="board" class="board">
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
    </div>

    <button id="restartButton" style="display: none;">Restart Game</button>

    <script src="script.js"></script>
</body>
</html>
