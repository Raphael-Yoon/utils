{% extends "base.html" %}

{% block title %}Create SR{% endblock %}

{% block content %}
<div class="card">
    <h2>신규 서비스 요청서 작성</h2>
    <p style="color: #666; margin-bottom: 30px;">Snowball 시스템 보완을 위한 테스트 증빙용 요청서를 작성합니다.</p>

    <form action="{{ url_for('create') }}" method="POST">
        <div class="form-group">
            <label for="requester">요청자 (이름)</label>
            <input type="text" id="requester" name="requester" value="Raphael" required>
        </div>

        <div class="form-group">
            <label for="title">서비스 요청 제목</label>
            <input type="text" id="title" name="title" placeholder="예: 데이터 동기화 스케줄 변경 요청" required>
        </div>

        <div class="form-group">
            <label for="content">상세 요청 내용</label>
            <textarea id="content" name="content" placeholder="요청 사항을 구체적으로 기술해 주세요." required></textarea>
        </div>

        <div style="margin-top: 30px;">
            <button type="submit" class="btn btn-success">서비스 요청서 등록</button>
            <a href="{{ url_for('index') }}" class="btn" style="color: #666;">취소</a>
        </div>
    </form>
</div>
{% endblock %}
